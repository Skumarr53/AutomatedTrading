# Prometheus configuration for AutomatedTrading stack
# Scrapes metrics from Ray dashboard and other services

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'trading-monitor'

# Alertmanager configuration (optional - uncomment if using)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# Load rules once and periodically evaluate them
rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Ray metrics from the trading-app (Ray runs inside trading-app container)
  # Ray exposes metrics on port 8080 by default when running with metrics enabled
  - job_name: 'ray'
    scrape_interval: 10s
    static_configs:
      - targets: ['trading-app:8080']
    metrics_path: '/metrics'
    # If Ray metrics endpoint is different, adjust accordingly
    # Ray dashboard metrics are typically on: http://<ray-head>:8265/metrics
    
  # Alternative: Ray metrics via dashboard (if exposed separately)
  - job_name: 'ray_dashboard'
    scrape_interval: 10s
    honor_labels: true
    static_configs:
      - targets: ['trading-app:8265']
    metrics_path: '/metrics'
    # Fallback if the above path doesn't work

  # InfluxDB metrics (InfluxDB 2.x exposes Prometheus metrics)
  - job_name: 'influxdb'
    scrape_interval: 15s
    static_configs:
      - targets: ['influxdb:8086']
    metrics_path: '/metrics'

  # Grafana metrics
  - job_name: 'grafana'
    scrape_interval: 30s
    static_configs:
      - targets: ['grafana:3000']
    metrics_path: '/metrics'

  # MLflow (if it exposes metrics - optional)
  # - job_name: 'mlflow'
  #   static_configs:
  #     - targets: ['mlflow:5000']
  #   metrics_path: '/metrics'
