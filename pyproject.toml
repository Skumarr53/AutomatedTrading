[tool.poetry]
name = "automatedtrading"
version = "0.1.0"
description = ""
authors = ["santhosh <skumarr53@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
loguru = "^0.7.2"
selenium = "^4.20"
pyotp = "^2.9.0"
fyers-apiv3 = "^3.1"
urllib3 = "^1.26.0"
pandas = "^2.0.0"           # pandas 2.x supports Python 3.8-3.11
hydra-core = "^1.3"
APScheduler = "^3.10.4"
Sphinx = "^7.1.1"
flask = "^3.0.3"
python-dotenv = "^1.0.1"
numpy = "1.24.4"            # 1.24.x is last to support Python 3.10
pyperclip = "^1.9.0"
ta-lib = "^0.4.32"          # 0.4.32 supports Python 3.7-3.11
joblib = "^1.4.2"
scikit-learn = "1.3.2"      # 1.3.x supports Python 3.8-3.11
influxdb-client = "^1.46.0"
tqdm = "^4.66.5"
mlflow = "^2.17.0"
seaborn = "^0.13.2"         # 0.13.x supports Python 3.9-3.11
shap = "^0.41.0"            # 0.41+ supports Python 3.7-3.11
imblearn = "^0.0"           # meta-package, pulls latest compatible
# If you use imbalanced-learn directly, specify: imbalanced-learn = "^0.11.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"