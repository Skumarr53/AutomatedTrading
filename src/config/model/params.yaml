# src/config/model/params.yaml
# 
# Hardware-Aware Optimization:
# These hyperparameter ranges are optimized for "balanced" mode (medium hardware tier).
# The hardware detector automatically adjusts:
#   - n_iter: Number of hyperparameter combinations to try (10-50 based on hardware)
#   - n_jobs: Parallel jobs for RandomizedSearchCV (based on CPU cores)
#   - max_samples_per_class: Sample limits (based on RAM)
#
# Hardware Tiers:
#   - Low: <8 cores, <16GB RAM → n_iter=15, narrower search
#   - Medium: 8-16 cores, 16-32GB RAM → n_iter=20, current ranges
#   - High: >16 cores, >32GB RAM → n_iter=30, wider exploration
#
pipeline_params:
  feature_selection__n_features: [10, 25, 50]

model_params:
  # LightGBM - Recommended for production (fast, handles categoricals natively)
  LGBM:
    model_fit__n_estimators: [100, 300, 500]
    model_fit__max_depth: [3, 5, 7, 10]
    model_fit__learning_rate: [0.01, 0.05, 0.1]
    model_fit__num_leaves: [15, 31, 63]
    model_fit__reg_alpha: [0, 0.1, 1.0]  # L1 regularization
    model_fit__reg_lambda: [0, 0.1, 1.0]  # L2 regularization
    model_fit__min_child_samples: [10, 20, 50]
    model_fit__subsample: [0.8, 1.0]
    model_fit__colsample_bytree: [0.8, 1.0]
    model_fit__verbosity: [-1]  # Suppress warnings
  
  # XGBoost - Alternative gradient boosting
  XGB:
    model_fit__n_estimators: [100, 300, 500]
    model_fit__max_depth: [3, 5, 7]
    model_fit__learning_rate: [0.01, 0.05, 0.1]
    model_fit__reg_alpha: [0, 0.1, 1.0]
    model_fit__reg_lambda: [0, 0.1, 1.0]
    model_fit__subsample: [0.8, 1.0]
    model_fit__colsample_bytree: [0.8, 1.0]
    model_fit__min_child_weight: [1, 5, 10]
  
  GBC:
    model_fit__n_estimators: [50, 100, 200]  # Increased range
    model_fit__max_depth: [3, 5, 7]
    model_fit__min_samples_split: [20, 50]
    model_fit__min_samples_leaf: [10, 20, 50]
    model_fit__learning_rate: [0.05, 0.1, 0.2]  # Added learning rate
  RFC:
    model_fit__n_estimators: [50, 100, 200]
    model_fit__max_depth: [5, 10, 15]  # Increased depth
    model_fit__min_samples_split: [10, 20, 50]
    model_fit__min_samples_leaf: [5, 10, 20]
  MLP:
    model_fit__hidden_layer_sizes: [[100], [100, 50], [50, 50]]
    model_fit__activation: ['relu']
    model_fit__solver: ['adam']
    model_fit__alpha: [0.0001, 0.001, 0.01]
    model_fit__learning_rate: ['adaptive']
    model_fit__early_stopping: [true]
  KNN:
    model_fit__n_neighbors: [5, 10, 15]
    model_fit__weights: ['uniform', 'distance']
  LR:
    model_fit__penalty: ['l2']
    model_fit__C: [0.1, 1.0, 10.0]
    model_fit__solver: ['lbfgs']
    model_fit__max_iter: [200, 500]
  


technical_indicators_params:
  bollinger_bands__timeperiod: [10, 12, 15]
  rsi__timeperiod: [5, 7, 9]
  macd__fastperiod: [3, 5, 8]
  macd__slowperiod: [16, 19, 22]
  macd__signalperiod: [3, 5, 7]
  stochastic_oscillator__fastk_period: [5, 7, 9]
  adx__timeperiod: [7, 10, 12]
  ema__short_period: [5, 7, 9]
  ema__long_period: [12, 15, 18]
  atr__timeperiod: [5, 7, 10]
  cci__timeperiod: [5, 10, 12]
  ichimoku_cloud__conversion_line_period: [6, 7, 9]
  ichimoku_cloud__base_line_periods: [16, 19, 22]
  ichimoku_cloud__lagging_span2_periods: [22, 30, 44]
  ichimoku_cloud__displacement: [16, 19, 22]
  fibonacci_retracements__window: [78, 156, 234]
# Custom model
custom_model_windows: [5, 15, 30, 60, 180]

