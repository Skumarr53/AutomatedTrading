# src/config/custom.yaml
trading_config:
  trade_mode: BACKTEST # "LIVE" "BACKTEST"
  manual_set_trade_mode: null
  redirect_url: "https://www.google.com/"
  response_type: "code"
  grant_type: "authorization_code"

base_payload_args:
  symbol: "{symbol}"
  resolution: "{interval}"
  date_format: "0"
  range_from: "{start_epoch_time}"
  range_to: "{end_epoch_time}"
  cont_flag: "1"

backtest_data_load:
  tech_inds_max_length: 234
  n_operations_hours_daily: 8
  volume_mean_windows: [3, 5]
  backtest_data_length_years: 3
  cs_patterns_max_length: 96
  n_operations_days_weekly:  5
  orderbook_file_suffix: orderbook_data
  ticker_file_suffix: ticker_data

model_settings:
  model_targets: ['PctChange', 'ATR']
  model_type: COMB
  # CRITICAL: shuffle must be false for temporal data to prevent data leakage
  # TimeSeriesSplit is now used for cross-validation
  shuffle: false
  run_ids:
    - 3h
    - 1h
    - 30min
    - 15min
    - 5min

target_encode_dict:
  'Low': -2
  'Medium Low': -1 
  'Neutral': 0
  'Medium High': 1
  'High': 2

live_mode_max_length:
   tech_ind_bollinger_bands: 

# New setting to control whether training combines
# data across all symbols or trains models per symbol.
training:
  combine_all_symbols: true

mlflow_config:
  enabled: true  # Whether to start the MLflow server
  host: "0.0.0.0"  # Server bind address (0.0.0.0 = all interfaces)
  port: 5000
  backend_store_uri: "sqlite:///mlflow.db"
  default_artifact_root: "./mlruns"
  startup_delay_seconds: 5  # Time to wait after starting the server
  tracking_uri: "http://localhost:5000"  # Client connection - use localhost, NOT 0.0.0.0

# Hardware optimization settings
# Auto-detects CPU cores, RAM, and GPU to optimize parallel processing
hardware_optimization:
  auto_detect: true  # Auto-detect hardware and optimize settings
  mode: balanced  # Optimization mode: 'speed' | 'balanced' | 'quality'
  # Manual overrides (only used if auto_detect=false)
  n_jobs: null  # null = auto-detect, or specify number of parallel jobs
  reserve_cores: 2  # Number of CPU cores to reserve for system (when auto_detect=true)
  use_gpu: null  # null = auto-detect, true/false to force GPU usage
  # Hardware tier overrides (only used if auto_detect=false)
  # 'low' (<8 cores, <16GB), 'medium' (8-16 cores, 16-32GB), 'high' (>16 cores, >32GB)
  hardware_tier: null