# src/config/custom.yaml
trading_config:
  trade_mode: LIVE # "LIVE" "BACKTEST"
  manual_set_trade_mode: null
  redirect_url: "https://www.google.com/"
  response_type: "code"
  grant_type: "authorization_code"

base_payload_args:
  symbol: "{symbol}"
  resolution: "{interval}"
  date_format: "0"
  range_from: "{start_epoch_time}"
  range_to: "{end_epoch_time}"
  cont_flag: "1"

backtest_data_load:
  tech_inds_max_length: 234
  n_operations_hours_daily: 8
  volume_mean_windows: [3, 5]
  backtest_data_length_years: 3
  cs_patterns_max_length: 96
  n_operations_days_weekly:  5
  orderbook_file_suffix: orderbook_data
  ticker_file_suffix: ticker_data

model_settings:
  model_targets: ['PctChange', 'ATR']
  model_type: COMB
  shuffle: true
  run_ids:
    - 5min
    - 15min
    - 30min
    - 1h
   #  - 3h

live_mode_max_length:
   tech_ind_bollinger_bands: 

# New setting to control whether training combines
# data across all symbols or trains models per symbol.
training:
  combine_all_symbols: false

mlflow_config:
  enabled: true  # Whether to start the MLflow server
  host: "0.0.0.0"
  port: 5000
  backend_store_uri: "sqlite:///mlflow.db"
  default_artifact_root: "./mlruns"
  startup_delay_seconds: 5  # Time to wait after starting the server
  tracking_uri: "http://0.0.0.0:5000"  # Used for client tracking